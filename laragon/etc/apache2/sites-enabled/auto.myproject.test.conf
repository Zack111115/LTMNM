<VirtualHost *:80> 
    DocumentRoot "C:/laragon/www/myproject"
    ServerName myproject.test
    ServerAlias *.myproject.test
    <Directory "C:/laragon/www/myproject">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# If you want to use SSL, enable it by going to Menu > Apache > SSL > Enabled
